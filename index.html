<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aplikasi Belajar Al-Qur’an Interaktif</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: {
                dark: '#0A3D62',
                light: '#1B9CFC',
              },
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              arabic: ['Noto Sans Arabic', 'sans-serif'],
            },
            animation: {
              'scale-in': 'scale-in 0.3s ease-out forwards',
            },
            keyframes: {
              'scale-in': {
                '0%': { transform: 'scale(0.9)', opacity: '0' },
                '100%': { transform: 'scale(1)', opacity: '1' },
              },
            },
          },
        },
      }
    </script>
    <style>
      /* Apply Noto Sans Arabic to elements with Arabic text */
      [lang="ar"] {
        font-family: 'Noto Sans Arabic', sans-serif;
      }
      /* Hide scrollbar for mobile nav */
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }
      /* Animation for module switching */
      @keyframes module-entry {
        from {
          opacity: 0;
          transform: translateY(15px) scale(0.99);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .animate-module-entry {
        animation: module-entry 0.4s ease-out forwards;
      }
      /* Animation for Tajwid rule cards */
      @keyframes card-entry {
        from {
          opacity: 0;
          transform: translateY(15px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .animate-card-entry {
        animation: card-entry 0.5s ease-out forwards;
        opacity: 0; /* Start hidden before animation runs */
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
</head>
  <body class="bg-gray-50 dark:bg-slate-900 text-gray-800 dark:text-gray-200 font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
